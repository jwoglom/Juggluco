name: Build

on:
  # Only the default branch, so that a push to a branch with a pull request
  # gives a single run, the pull_request one, instead of two.
  push:
    branches:
      - primary
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle assemble task to run
        default: assembleMobileLibre3SiDexNogoogleReleaseLog
        type: string
      libs_version:
        description: Released Juggluco version to take the prebuilt native libraries from
        default: '11.1.0'
        type: string
      build_probe:
        description: Also build the read-only NFC patch-info probe APK
        default: true
        type: boolean

env:
  # The task from the BUILD section of README.md: a logging mobile phone
  # release version.
  TASK: ${{ inputs.task || 'assembleMobileLibre3SiDexNogoogleReleaseLog' }}
  # Release whose APK the native libraries that are not part of this
  # repository are taken from, see scripts/fetch-prebuilt-libs.sh.
  JUGGLUCO_LIBS_VERSION: ${{ inputs.libs_version || '11.1.0' }}
  # Whether to also build the -PnfcProbeOnly=1 diagnostic APK. On for push and
  # pull_request; workflow_dispatch can turn it off. Tested on github.event_name
  # rather than on inputs.build_probe alone, because for the other two events the
  # input is unset and an unset input compares equal to false.
  BUILD_PROBE: ${{ github.event_name != 'workflow_dispatch' || inputs.build_probe }}
  # Matches ndkver, CMAKEVERSION and compileSdk in Common/build.gradle.
  NDK_VERSION: '30.0.16138531'
  CMAKE_VERSION: '4.1.2'
  COMPILE_SDK: '36'
  # The build tools version the Android Gradle plugin asks for.
  BUILD_TOOLS_VERSION: '36.0.0'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # The native build builds the host tool rtlpp
          # (Common/src/main/cpp/cmake/rtlpp-host), which links against ICU.
          sudo apt-get update
          sudo apt-get install -y libicu-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK platform, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

      - name: Declare the minor API level of the SDK platform
        run: |
          # Common/build.gradle sets compileSdkMinor 0, so the Android Gradle
          # plugin looks for the platform 'android-36.0'. The android-36
          # package does not mention a minor API level, which makes it hash as
          # 'android-36' and the build fail with "Failed to find target with
          # hash string 'android-36.0'". Adding the minor level it in fact has
          # makes it match.
          props="$ANDROID_HOME/platforms/android-$COMPILE_SDK/source.properties"
          grep -q '^AndroidVersion.MinorApiLevel=' "$props" ||
            echo 'AndroidVersion.MinorApiLevel=0' >> "$props"

      - name: Point local.properties at the runner's SDK
        run: |
          # The checked-in local.properties holds the paths of the
          # maintainer's machine, so replace it.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Cache the APK the prebuilt libraries come from
        uses: actions/cache@v4
        with:
          path: build/prebuilt-libs
          key: juggluco-apk-${{ env.JUGGLUCO_LIBS_VERSION }}

      - name: Download and extract the prebuilt native libraries
        run: ./scripts/fetch-prebuilt-libs.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon --stacktrace "$TASK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: juggluco-${{ env.TASK }}
          path: |
            Common/build/outputs/apk/**/*.apk
            Common/build/outputs/mapping/**/mapping.txt
          if-no-files-found: error

      # A second APK of the same task with BuildConfig.nfcProbeOnly == 1. An NFC
      # scan of a Libre 3 family sensor then reads the patch info, logs the
      # decoded securityVersion / productType / patchState / serial, and stops
      # before the activation write. It is the safe way to identify an unknown
      # sensor variant, because activating one with the wrong parameters cannot
      # be undone. Only the Java pipeline is rebuilt, the native build is reused.
      - name: Build the NFC probe APK
        if: env.BUILD_PROBE == 'true'
        run: ./gradlew --no-daemon --stacktrace -PnfcProbeOnly=1 "$TASK"

      - name: Collect the NFC probe APK
        if: env.BUILD_PROBE == 'true'
        run: |
          # The probe reuses the task's output paths, so move it aside under a
          # name that cannot be confused with the normal build. It carries the
          # same applicationId, so only one of the two can be installed at once.
          mkdir -p build/nfc-probe
          find Common/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              cp "$apk" "build/nfc-probe/nfcprobe-$(basename "$apk")"
            done
          ls -l build/nfc-probe

      - name: Upload the NFC probe APK
        if: env.BUILD_PROBE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: juggluco-nfcprobe-${{ env.TASK }}
          path: build/nfc-probe/*.apk
          if-no-files-found: error
