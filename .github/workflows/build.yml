name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle assemble task to run
        default: assembleMobileLibre3SiDexNogoogleReleaseLog
        type: string
      libs_version:
        description: Released Juggluco version to take the prebuilt native libraries from
        default: '11.1.0'
        type: string

env:
  # The task from the BUILD section of README.md: a logging mobile phone
  # release version.
  TASK: ${{ inputs.task || 'assembleMobileLibre3SiDexNogoogleReleaseLog' }}
  # Release whose APK the native libraries that are not part of this
  # repository are taken from, see scripts/fetch-prebuilt-libs.sh.
  JUGGLUCO_LIBS_VERSION: ${{ inputs.libs_version || '11.1.0' }}
  # Matches ndkver, CMAKEVERSION and compileSdk in Common/build.gradle.
  NDK_VERSION: '30.0.16138531'
  CMAKE_VERSION: '4.1.2'
  COMPILE_SDK: '36'
  # The build tools version the Android Gradle plugin asks for.
  BUILD_TOOLS_VERSION: '36.0.0'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          # The native build builds the host tool rtlpp
          # (Common/src/main/cpp/cmake/rtlpp-host), which links against ICU.
          sudo apt-get update
          sudo apt-get install -y libicu-dev

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK platform, NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION"

      - name: Declare the minor API level of the SDK platform
        run: |
          # Common/build.gradle sets compileSdkMinor 0, so the Android Gradle
          # plugin looks for the platform 'android-36.0'. The android-36
          # package does not mention a minor API level, which makes it hash as
          # 'android-36' and the build fail with "Failed to find target with
          # hash string 'android-36.0'". Adding the minor level it in fact has
          # makes it match.
          props="$ANDROID_HOME/platforms/android-$COMPILE_SDK/source.properties"
          grep -q '^AndroidVersion.MinorApiLevel=' "$props" ||
            echo 'AndroidVersion.MinorApiLevel=0' >> "$props"

      - name: Point local.properties at the runner's SDK
        run: |
          # The checked-in local.properties holds the paths of the
          # maintainer's machine, so replace it.
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Cache the APK the prebuilt libraries come from
        uses: actions/cache@v4
        with:
          path: build/prebuilt-libs
          key: juggluco-apk-${{ env.JUGGLUCO_LIBS_VERSION }}

      - name: Download and extract the prebuilt native libraries
        run: ./scripts/fetch-prebuilt-libs.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon --stacktrace "$TASK"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: juggluco-${{ env.TASK }}
          path: |
            Common/build/outputs/apk/**/*.apk
            Common/build/outputs/mapping/**/mapping.txt
          if-no-files-found: error
